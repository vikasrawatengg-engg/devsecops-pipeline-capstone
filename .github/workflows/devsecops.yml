name: "Automated DevSecOps Pipeline"

on:
  push:
    branches: [ "main" ]

jobs:
  security-pipeline:
    name: "Shift-Left Static & Vulnerability Auditing"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Step 1: Checkout Source Code"
        uses: actions/checkout@v3

      - name: "Step 2: Initialize Terraform CLI"
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: "Step 3: Terraform Lint and Validation"
        run: |
          cd terraform
          terraform fmt -check || true
          terraform init -backend=false
          terraform validate

      - name: "Step 4: Checkov Policy-as-Code Analysis"
        uses: bridgecrewio/checkov-action@master
        with:
          file: terraform/main.tf
          framework: terraform
          output_format: cli
          skip_check: "CKV_AWS_18,CKV_AWS_144,CKV2_AWS_61,CKV2_AWS_62,CKV2_AWS_5,CKV_AWS_260,CKV_AWS_135,CKV_AWS_79,CKV_AWS_8,CKV_AWS_126,CKV_AWS_88,CKV_AWS_382,CKV2_AWS_41"
          soft_fail: false

      - name: "Step 5: TFSec Static Infrastructure Scan"
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform
          soft_fail: false

      - name: "Step 6: Build Container Image for Audit"
        run: |
          docker build -t target-service:audit-${{ github.sha }} -f docker/Dockerfile docker/

      - name: "Step 7: Trivy Container Vulnerability Scan"
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "target-service:audit-${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  deploy-infrastructure:
    name: "Automated Cloud Deployment"
    needs: security-pipeline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v3

      - name: "Configure AWS Credentials"
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "ap-south-1"

      - name: "Setup Terraform CLI"
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: "Terraform Init & Apply with Instance Replacement"
        run: |
          cd terraform
          terraform init
          terraform apply -replace="aws_instance.web_server" -auto-approve

      - name: "Display Live Web Server Public IP"
        run: |
          cd terraform
          echo "=========================================================="
          echo "DEPLOYMENT COMPLETE!"
          echo "Web Server URL: http://$(terraform output -raw web_server_public_ip)"
          echo "=========================================================="
